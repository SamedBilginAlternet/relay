# ---------------------------------------------------------------------------
# Relay — static SPA server (inside the frontend container).
#
# Responsibilities:
#   1. Serve the Vite build with history fallback (any unknown path -> index.html)
#   2. Cache policy: hashed assets forever, index.html + service worker never
#   3. NOT proxy /api — the edge (Caddy on the host) does that, including the
#      SSE stream /api/runs/{id}/stream.
#
# Listens on :80 inside the container. In production the container port is
# published on ALL interfaces as ${WEB_PORT} (Caddy runs in a container and
# reaches it through host.docker.internal — a 127.0.0.1 binding 502s).
# ---------------------------------------------------------------------------

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # vite-plugin-pwa emits .webmanifest; older mime.types do not know it.
    # (Recent nginx already ships this mapping, in which case the error log
    #  shows a harmless `duplicate extension "webmanifest"` warning at start.)
    types {
        application/manifest+json  webmanifest;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    absolute_redirect off;

    # Caddy already compresses on the edge, but keep gzip on so the container
    # is also correct when hit directly (staging, port-forward, curl).
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json
                      application/wasm image/svg+xml font/woff font/woff2;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        charset utf-8;

        # ---- container healthcheck -------------------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # ---- never cache the app shell ---------------------------------
        # Exact-match locations win over every regex location below.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Service worker + its registration shim. If these are cached the app
        # can never update itself. vite-plugin-pwa emits sw.js + registerSW.js.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }
        location = /registerSW.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Workbox runtime chunks are content-hashed but are pulled by the SW,
        # keep them revalidating so a stale SW never pins an old runtime.
        # (Regex locations are evaluated in order — this must precede the
        #  generic static-asset regex below.)
        location ~* ^/workbox-[^/]+\.js$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ---- immutable, content-hashed build output ---------------------
        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Self-hosted fonts and images emitted outside /assets/ still carry a
        # content hash from Vite, so they are safe to pin as well.
        location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|ico|svg)$ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # ---- SPA history fallback ---------------------------------------
        # Anything else -> index.html so client-side routes deep-link.
        # This location also serves "/" itself, hence the no-cache header.
        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ /index.html;
        }

        # A request that reaches this container for /api means the edge is
        # misconfigured. Fail loudly instead of returning the SPA shell — an
        # SSE client that receives text/html here hangs instead of erroring.
        location /api/ { return 404 "api is served by the edge, not this container\n"; }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { internal; root /usr/share/nginx/html; }
    }
}
