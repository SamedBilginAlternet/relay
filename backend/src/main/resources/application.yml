server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: relay
  datasource:
    # In Docker the database service is named `db`.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${SPRING_DATASOURCE_USERNAME:relay}
    password: ${SPRING_DATASOURCE_PASSWORD:relay}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    async:
      # SSE streams are long lived; the emitter carries its own timeout.
      request-timeout: -1
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    generator:
      # Money is a BigDecimal fixed at six decimals (CostMeter.usd). Without this a small
      # one still prints as 3.82E-4, and a price in scientific notation is not a price.
      write-bigdecimal-as-plain: true

app:
  version: 0.1.0
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  # Dev fallback only — set APP_ENCRYPTION_KEY in every real environment.
  encryption:
    key: ${APP_ENCRYPTION_KEY:relay-dev-key-not-for-production}
  tools:
    # live | replay — replay plays recorded fixtures and needs no accounts.
    mode: ${TOOLS_MODE:replay}
  budget:
    default-usd: ${DEFAULT_BUDGET_USD:0.50}
  auth:
    # Guard on /api/**. Only turn it off for an offline demo you control end to end.
    enabled: ${AUTH_ENABLED:true}
    cookie:
      # Browsers exempt localhost, so this can stay true in local development.
      secure: ${AUTH_COOKIE_SECURE:true}
    # Where the Google sign-in callback drops the browser once the cookie is set.
    success-redirect: ${AUTH_SUCCESS_REDIRECT:/}
    google:
      # Identity-only callback; must also be registered in the Google console.
      # Empty means "derive it from the incoming request" (right for same-origin deploys).
      redirect-uri: ${GOOGLE_LOGIN_REDIRECT_URI:}
  brief:
    # Per-tool ceiling for the parallel fan-out; a slow provider never blocks the screen.
    tool-timeout-seconds: ${BRIEF_TOOL_TIMEOUT_SECONDS:8}
    # Every miss costs one classification call; on a free-tier key that budget is the
    # scarcest thing we have. Refresh is always available on the screen.
    cache-seconds: ${BRIEF_CACHE_SECONDS:180}
    # Build the first brief at boot instead of making the first visitor pay for it. Every
    # deploy is a restart, and a cold build measured 28.6s on the live box the moment all
    # seven Groq keys hit their daily wall. Same single build, moved off the critical path.
    warm-on-start: ${BRIEF_WARM_ON_START:true}
    timezone: ${BRIEF_TIMEZONE:Europe/Istanbul}
    # Fallback project for a jira.createIssue suggestion when no Jira issue is in the brief.
    default-project-key: ${BRIEF_DEFAULT_PROJECT_KEY:RELAY}
  google:
    # Empty means "not configured": Gmail/Calendar report unavailable, everything else runs.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    # Where to send the browser after a successful consent; empty returns JSON instead.
    success-redirect: ${GOOGLE_SUCCESS_REDIRECT:}
  groq:
    # Comma separated. Empty means the stub LLM, which always works offline.
    api-keys: ${GROQ_API_KEYS:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    # Where the cheap jobs go (app.llm.small-purposes), and where everything falls back to
    # when the big model is spent — rate limits are counted per model.
    small-model: ${GROQ_SMALL_MODEL:llama-3.1-8b-instant}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    # The name that reaches the screen next to every price. This client speaks the
    # OpenAI chat-completions shape, so the primary tier can be pointed at any provider
    # that does — and the label has to follow, or a step reads `groq:deepseek-v4-flash`.
    provider: ${LLM_PRIMARY_PROVIDER:groq}
    cooldown-seconds: 60
    price:
      input-usd-per-million: ${GROQ_PRICE_INPUT:0.59}
      output-usd-per-million: ${GROQ_PRICE_OUTPUT:0.79}
    # The small tier's own rate. Without it both tiers are billed at the big model's price
    # and the whole point of the split — a smaller number — never shows up.
    small-price:
      input-usd-per-million: ${GROQ_SMALL_PRICE_INPUT:0.05}
      output-usd-per-million: ${GROQ_SMALL_PRICE_OUTPUT:0.08}
  llm:
    # Which jobs the small model is enough for. Comma separated; blank uses the default
    # below. Everything not named here — including a purpose this build has never heard of —
    # goes to the strong model, because unknown must mean expensive, never wrong.
    #
    #   verify      a yes/no and one sentence
    #   summarize   three sentences
    #   ask_route   one provider query
    #
    # Deliberately not here: plan, tool_params, digest, insight, ask_answer. Those decide
    # what gets written where, or what the user is told is true.
    small-purposes: ${LLM_SMALL_PURPOSES:verify,summarize,ask_route}
    # The paid tier behind the free one. Empty = no second provider, and the stub stays the
    # only safety net. Any OpenAI-compatible endpoint works: this code posts to
    # {base-url}/chat/completions with a bearer key.
    fallback:
      api-keys: ${LLM_FALLBACK_API_KEYS:}
      base-url: ${LLM_FALLBACK_BASE_URL:https://api.deepseek.com}
      model: ${LLM_FALLBACK_MODEL:deepseek-v4-flash}
      provider: ${LLM_FALLBACK_PROVIDER:deepseek}
      price:
        input-usd-per-million: ${LLM_FALLBACK_PRICE_INPUT:0.14}
        output-usd-per-million: ${LLM_FALLBACK_PRICE_OUTPUT:0.28}

logging:
  level:
    root: INFO
    com.relay: INFO
    org.hibernate.SQL: WARN
